# Optional Cargo extras observed in the inventory. The always-on modern module
# installs Rust for its own Cargo tools.
[tools]
"cargo:procs" = "latest"
"cargo:ouch" = "latest"
"cargo:dua-cli" = "latest"
"cargo:xcp" = "latest"

[dotfiles]
"~/.config/julesimf-shell/modern-extra.zsh" = { source = "shell/modern-extra.zsh", mode = "copy" }
"~/.zshrc/julesimf-modern-extra" = { block = '[[ -r "$HOME/.config/julesimf-shell/modern-extra.zsh" ]] && source "$HOME/.config/julesimf-shell/modern-extra.zsh"' }
