"dnf:jq" = "latest"
"pacman:zsh" = "latest"
"pacman:git" = "latest"
"pacman:curl" = "latest"
"pacman:ca-certificates" = "latest"
"pacman:jq" = "latest"
"apk:zsh" = "latest"
